- con{{PFX}}UploadDialog:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      BorderColor: =AppTheme.Dialog.Info.Border
      BorderThickness: =1
      Fill: =AppTheme.Color.ContentBg
      Height: |+
        =540
      LayoutAlignItems: =LayoutAlignItems.Center
      LayoutDirection: =LayoutDirection.Vertical
      LayoutGap: =12
      PaddingBottom: =24
      PaddingLeft: =24
      PaddingRight: =24
      PaddingTop: =24
      Visible: =gbl{{PFX}}UploadShow
      Width: =560
      X: =(Parent.Width - 560) / 2
      Y: =(Parent.Height - 540) / 2
    Children:
      - lbl{{PFX}}UploadTitle:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =AppTheme.Color.TextPrimary
            FontWeight: =FontWeight.Bold
            Height: =28
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            PaddingBottom: =0
            PaddingTop: =0
            Size: =16
            Text: ="자산 CSV 일괄등록"
            Width: =Parent.Width - 48
      - lbl{{PFX}}UploadGuide:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Center
            Color: =AppTheme.Color.TextSecondary
            Height: =44
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            PaddingBottom: =0
            PaddingTop: =0
            Size: =11
            Text: ="자산명·분류·취득일·취득가액·감가상각기간·자산보유부서 열이 필요합니다. 자산코드는 자동 채번됩니다. 파일은 UTF-8 CSV로 저장해야 합니다."
            Width: =Parent.Width - 48
      - frm{{PFX}}Upload:
          Control: Form@2.4.4
          Variant: Modern
          Layout: Vertical
          Properties:
            DataSource: =CSV업로드
            DefaultMode: =FormMode.New
            Height: |+
              =180
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            NumberOfColumns: =1
            Width: =Parent.Width - 48
          Children:
            - card{{PFX}}UploadAttach:
                Control: TypedDataCard@1.0.7
                Variant: ModernAttachmentsEdit
                IsLocked: true
                Properties:
                  DataField: ="{Attachments}"
                  Default: =ThisItem.'첨부 파일'
                  DisplayName: =DataSourceInfo([@CSV업로드],DataSourceInfo.DisplayName,'{Attachments}')
                  Required: =false
                  Update: =att{{PFX}}UploadFile.Attachments
                  Width: =Parent.Width
                  X: =0
                  Y: =0
                Children:
                  - lbl{{PFX}}UploadAttachKey:
                      Control: ModernText@1.0.0
                      MetadataKey: FieldName
                      Properties:
                        FontWeight: =FontWeight.Semibold
                        Height: =22
                        PaddingBottom: =0
                        PaddingTop: =0
                        Size: =14
                        Text: ="CSV 파일 선택"
                        Width: =Parent.Width - 48
                        Wrap: =false
                        X: =24
                        Y: =10
                  - att{{PFX}}UploadFile:
                      Control: Attachments@2.3.0
                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        BorderThickness: =If(IsBlank(Parent.Error), 0, 1)
                        DisplayMode: =Parent.DisplayMode
                        Fill: =RGBA(245,245,245, 1)
                        Items: =Parent.Default
                        PaddingBottom: =5
                        PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
                        PaddingRight: =5
                        PaddingTop: =5
                        Tooltip: =Parent.DisplayName
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =lbl{{PFX}}UploadAttachKey.Y + lbl{{PFX}}UploadAttachKey.Height + 4
                  - lbl{{PFX}}UploadAttachErr:
                      Control: ModernText@1.0.0
                      MetadataKey: ErrorMessage
                      Properties:
                        Height: =30
                        Size: =14
                        Text: =Parent.Error
                        Visible: =And(!IsBlank(Parent.Error), Parent.DisplayMode=DisplayMode.Edit)
                        Width: =Parent.Width - 48
                        X: =24
                        Y: =att{{PFX}}UploadFile.Y + att{{PFX}}UploadFile.Height
                  - lbl{{PFX}}UploadAttachStar:
                      Control: ModernText@1.0.0
                      MetadataKey: FieldRequired
                      Properties:
                        Align: =Align.Center
                        Color: =Color.Red
                        Height: =lbl{{PFX}}UploadAttachKey.Height
                        PaddingBottom: =0
                        PaddingTop: =0
                        Text: ="*"
                        Visible: =And(Parent.Required, Parent.DisplayMode=DisplayMode.Edit)
                        Width: =30
                        Y: =lbl{{PFX}}UploadAttachKey.Y
      - lbl{{PFX}}UploadMsg:
          Control: ModernText@1.0.0
          Properties:
            Align: =Align.Left
            Color: =AppTheme.Color.TextSecondary
            Height: =130
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            PaddingBottom: =0
            PaddingTop: =0
            Size: =11
            Text: =gbl{{PFX}}UploadMsg
            Width: =Parent.Width - 48
      - con{{PFX}}UploadBtnRow:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =40
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =12
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutMinHeight: =16
            LayoutMinWidth: =16
            Width: =Parent.Width - 48
          Children:
            - btn{{PFX}}UploadRun:
                Control: ModernButton@1.0.0
                Properties:
                  DisplayMode: |-
                    =If(
                        CountRows(att{{PFX}}UploadFile.Attachments) = 1,
                        DisplayMode.Edit,
                        DisplayMode.Disabled
                    )
                  Height: =36
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: |+
                    =Set(gbl{{PFX}}UploadMsg, "")

                  Text: ="등록"
                  Width: =140
            - btn{{PFX}}UploadClose:
                Control: ModernButton@1.0.0
                Properties:
                  Height: =36
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  OnSelect: =Set(gbl{{PFX}}UploadShow, false)
                  Size: =12
                  Text: ="닫기"
                  Width: =120
